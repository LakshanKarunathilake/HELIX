# Neo4j connection for the HELIX graph-neighborhood feature.
#
# Copy this file to `neo4j.yaml` (same directory) and fill in your values:
#     cp neo4j.example.yaml neo4j.yaml
#
# Resolution order is: neo4j.yaml (or the path in $HELIX_NEO4J_CONFIG) > env vars
# (NEO4J_URI / NEO4J_USER / NEO4J_PASSWORD / NEO4J_DATABASE) > these defaults.
#
# `neo4j.yaml` is git-ignored because it contains your password.

uri: bolt://localhost:7687
user: neo4j
password: change-me
# database: neo4j          # optional; omit for the default database

# Graph schema — only change these if your graph differs from the assumed shape:
#   (:Concept {cui})-[:RELATES_TO {rel}]-(:Concept)
schema:
  node_label: Concept      # node label
  id_prop: cui             # node property matching your candidate CUIs
  rel_type: RELATES_TO     # relationship type
  rel_prop: rel            # edge property holding the semantic relation (e.g. "mapped_from")
  name_prop: concept       # node property for a human-readable name (falls back to the id)

  # Optional — focus the graph on specific relation labels (values of `rel`).
  # Leave both empty/omitted for all relations. Use ONE of these, not both.
  # rel_include: [is_a, PAR, CHD, RB, RN]   # only show these relations
  # rel_exclude: [mapped_to, mapped_from]   # show everything except these
