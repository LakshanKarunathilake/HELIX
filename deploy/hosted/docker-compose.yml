# HELIX hosted server: web + api behind Caddy (TLS); sign-in is the app's own (Google via Firebase).
# The search server (kb) and graph (neo4j) serve the demo data and publish no ports.
# Build the demo index before the first start: see README.md, "Demo data".
#
#   docker compose -f deploy/hosted/docker-compose.yml --env-file deploy/hosted/.env up -d --build

name: helix

services:
  api:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.api
    environment:
      HELIX_HOSTED: "1"
      HELIX_AUTH: "1"
      HELIX_PUBLIC_URL: https://${HELIX_DOMAIN:?set HELIX_DOMAIN in .env}
      # Public web identifiers (GET /api/info hands them to the browser); not secrets.
      HELIX_FIREBASE_PROJECT_ID: ${HELIX_FIREBASE_PROJECT_ID:?set HELIX_FIREBASE_PROJECT_ID in .env}
      HELIX_FIREBASE_API_KEY: ${HELIX_FIREBASE_API_KEY:?set HELIX_FIREBASE_API_KEY in .env}
      HELIX_FIREBASE_AUTH_DOMAIN: ${HELIX_FIREBASE_AUTH_DOMAIN:?set HELIX_FIREBASE_AUTH_DOMAIN in .env}
      # The two internal containers may be called over plain http / unencrypted Bolt.
      HELIX_URL_ALLOWLIST: kb:8765,neo4j:7687,${HELIX_URL_ALLOWLIST:-}
      # Read by the demo graph builder and session seed script (README.md, "Demo data").
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      # Shown on every page. NLM asks for this attribution with MeSH data.
      HELIX_NOTICE: "${HELIX_NOTICE:-Demo data: Medical Subject Headings (MeSH) 2026. Courtesy of the U.S. National Library of Medicine. It may not reflect the most current data available from NLM. NLM does not endorse this service.}"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - sessions:/app/sessions
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.web
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4@sha256:226d1f059b75399fe19182893c7184591c07b97afc8dfcf44eeb80c9a77a530f
    ports:
      - "80:80"
      - "443:443"
    environment:
      HELIX_DOMAIN: ${HELIX_DOMAIN:?set HELIX_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
    restart: unless-stopped

  # Search server for the demo index. No ports: only api reaches it.
  kb:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.kb
    environment:
      KB_INDEX_PATH: /data/index/mesh-diseases
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      # Built on this server by scripts/build_demo_index.py; a relative path starts here.
      - ${DEMO_INDEX_DIR:-./demo-index}:/data/index:ro
      - hf_cache:/root/.cache/huggingface    # the downloaded search model
    restart: unless-stopped

  # Demo graph. No ports: only api reaches it.
  neo4j:
    image: neo4j:5.26.33-community@sha256:51d0314ef86074f519003da8dd4daaa9fff72b8479672b742d7cab7f3064e3ed
    environment:
      # Sets the password only when the data volume is first created (README.md).
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 1G
      # The demo graph is small; without a cap Neo4j sizes this from the server's memory.
      NEO4J_server_memory_pagecache_size: 256M
      # Neo4j sends no usage data from this server.
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  sessions:
  caddy_data:
  neo4j_data:
  hf_cache:
