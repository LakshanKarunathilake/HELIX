# HELIX hosted server: web + api behind Caddy (TLS); sign-in is the app's own (Google via Firebase). See README.md.
#
#   docker compose -f deploy/hosted/docker-compose.yml --env-file deploy/hosted/.env up -d --build

name: helix

services:
  api:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.api
    environment:
      HELIX_HOSTED: "1"
      HELIX_AUTH: "1"
      HELIX_PUBLIC_URL: https://${HELIX_DOMAIN:?set HELIX_DOMAIN in .env}
      # Public web identifiers (GET /api/info hands them to the browser); not secrets.
      HELIX_FIREBASE_PROJECT_ID: ${HELIX_FIREBASE_PROJECT_ID:?set HELIX_FIREBASE_PROJECT_ID in .env}
      HELIX_FIREBASE_API_KEY: ${HELIX_FIREBASE_API_KEY:?set HELIX_FIREBASE_API_KEY in .env}
      HELIX_FIREBASE_AUTH_DOMAIN: ${HELIX_FIREBASE_AUTH_DOMAIN:?set HELIX_FIREBASE_AUTH_DOMAIN in .env}
      HELIX_URL_ALLOWLIST: ${HELIX_URL_ALLOWLIST:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - sessions:/app/sessions
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.web
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4
    ports:
      - "80:80"
      - "443:443"
    environment:
      HELIX_DOMAIN: ${HELIX_DOMAIN:?set HELIX_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  sessions:
  caddy_data:
