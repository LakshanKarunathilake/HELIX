# HELIX evaluation config for BC5CDR-chemical. Copy to eval/eval_config.bc5cdr.yaml.
#
# Prerequisite: the KB server must serve a SAPBERT FAISS index built from the
# BC5CDR chemical dictionary (train_dictionary.txt) so that predicted ids are the
# same MeSH ids as the gold (D####### / C######). Point kb.endpoint_url at it.
#
# The gold TSVs come from eval/convert_bc5cdr.py (dev/train/test). The runner
# eval/run_bc5cdr.sh passes each split via --gold, so gold_file below is a
# default only.

gold_file: eval/out/bc5cdr-chemical.dev.gold.tsv
delimiter: "\t"
gold_sep: "|"                # composite mentions are pipe-joined (any-match scoring)
columns:
  text: entity_text
  gold: cui
  entity_type: entity_type

kb:
  name: BC5CDR
  endpoint_url: http://127.0.0.1:8765/query   # KB server serving the BC5CDR index
  top_k: 10
  response_path: results
  id_field: id
  label_field: label
  score_field: score

configs: [lexical, dense, hybrid, hybrid_llm]

llm:
  model: claude-haiku-4-5    # needs ANTHROPIC_API_KEY (or configure an OpenAI/Gemini model)
  top_n: 10

output: eval/out/bc5cdr-chemical.dev.results.json
